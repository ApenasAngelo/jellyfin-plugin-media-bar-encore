# Encore: builds the plugin zip for a vX.Y.Z.W tag and publishes it as a GitHub release.
# The changelog is the annotated tag message. The plugin repository manifest
# (ApenasAngelo/jellyfin-plugins) picks the release up on its own schedule.
name: Encore release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT: Jellyfin.Plugin.MediaBarEnhanced/Jellyfin.Plugin.MediaBarEnhanced.csproj
  BUILD_ARGS: ""

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build "$PROJECT" -c Release -o build -p:Version=${GITHUB_REF_NAME#v} $BUILD_ARGS

      - name: Package
        run: |
          tag=$GITHUB_REF_NAME
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" | sed '/^-----BEGIN PGP/,$d' > changelog.md
          name=$(basename build/*.deps.json .deps.json)
          jq --arg v "${tag#v}" --rawfile c changelog.md --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {version: $v, changelog: ($c | rtrimstr("\n")), timestamp: $t}' encore/meta.json > build/meta.json
          (cd build && zip "../$name-${tag#v}.zip" "$name.dll" "$name.pdb" "$name.deps.json" logo.png meta.json)
          echo "ZIP=$name-${tag#v}.zip" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --notes-file changelog.md --verify-tag
