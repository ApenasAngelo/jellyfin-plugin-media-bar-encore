name: Auto Release Plugin

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'jellyfin.ruleset'
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'
      - 'logo.png'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Version from Manifest
        id: read_version
        run: |
          VERSION=$(jq -r '.[0].versions[0].version' manifest.json)
          CHANGELOG=$(jq -r '.[0].versions[0].changelog' manifest.json)
          TARGET_ABI=$(jq -r '.[0].versions[0].targetAbi' manifest.json)
          
          echo "Detected Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TARGET_ABI=$TARGET_ABI" >> $GITHUB_ENV
          
          # Also export GUID for later use
          PLUGIN_GUID=$(jq -r '.[0].guid' manifest.json)
          echo "PLUGIN_GUID=$PLUGIN_GUID" >> $GITHUB_ENV
          
          # Escape newlines in changelog for GITHUB_ENV
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check if Release Already Exists
        id: check_release
        shell: bash
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          VERSION="${{ env.VERSION }}"
          TAG="v$VERSION"
          API_URL="https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/tags/$TAG"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Release $TAG already exists. Skipping release-related steps."
            echo "release_exists=true" >> $GITHUB_OUTPUT
          elif [ "$HTTP_STATUS" -eq 404 ]; then
            echo "No existing release for $TAG. Continuing." 
            echo "release_exists=false" >> $GITHUB_OUTPUT
          else
            echo "Unexpected response when checking release: $HTTP_STATUS"
            exit 1
          fi

      - name: Setup .NET
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Build and Zip
        if: steps.check_release.outputs.release_exists == 'false'
        shell: bash
        run: |
          # Inject version from manifest into the build
          dotnet build Jellyfin.Plugin.MediaBarEnhanced/Jellyfin.Plugin.MediaBarEnhanced.csproj --configuration Release --output bin/Publish /p:Version=${{ env.VERSION }} /p:AssemblyVersion=${{ env.VERSION }}
          
          ZIP_NAME="Jellyfin.Plugin.MediaBarEnhanced_v${{ env.VERSION }}.zip"
          cd bin/Publish
          zip -r "$ZIP_NAME" *
          cd ../..
          
          # Calculate hash
          HASH=$(md5sum "bin/Publish/$ZIP_NAME" | awk '{ print $1 }')
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Export variables for next steps
          echo "ZIP_HASH=$HASH" >> $GITHUB_ENV
          echo "BUILD_TIME=$TIME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=bin/Publish/$ZIP_NAME" >> $GITHUB_ENV

      - name: Update manifest.json
        if: steps.check_release.outputs.release_exists == 'false'
        shell: bash
        run: |
            REPO_OWNER="${{ github.repository_owner }}"
            REPO_NAME="${{ github.event.repository.name }}"
            VERSION="${{ env.VERSION }}"
            DOWNLOAD_URL="https://github.com/$REPO_OWNER/$REPO_NAME/releases/download/v$VERSION/${{ env.ZIP_NAME }}"
            
            echo "Updating manifest.json with:"
            echo "Hash: ${{ env.ZIP_HASH }}"
            echo "Time: ${{ env.BUILD_TIME }}"
            echo "Url:  $DOWNLOAD_URL"
            
            jq --arg hash "${{ env.ZIP_HASH }}" \
             --arg time "${{ env.BUILD_TIME }}" \
             --arg url "$DOWNLOAD_URL" \
             --arg ver "$VERSION" \
             '.[0].versions |= map(if .version == $ver then .checksum = $hash | .timestamp = $time | .sourceUrl = $url else . end)' \
             manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json

      - name: Commit manifest.json
        if: steps.check_release.outputs.release_exists == 'false'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update manifest.json for release v${{ env.VERSION }} [skip ci]"
          file_pattern: manifest.json

      - name: Fetch PR Details for Release Notes
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Try finding PR associated with current commit
          PR_JSON=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0] // empty')
          
          # 2. Fallback to latest merged PR into main if empty
          if [ -z "$PR_JSON" ]; then
            PR_JSON=$(gh pr list --repo ${{ github.repository }} --state merged --base main --limit 1 --json title,body --jq '.[0] // empty')
          fi
          
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // empty')
          
          # 3. Construct formatted release notes: PR title at top, then Changelog header, then PR body
          if [ -n "$PR_TITLE" ] && [ -n "$PR_BODY" ]; then
            # Strip redundant top "## Release v..." line from body if present
            CLEAN_BODY=$(printf '%s\n' "$PR_BODY" | sed -E '1{/^##[[:space:]]+Release/d}')
            RELEASE_NOTES=$(printf "# %s\n\n## 📋 Changelog\n\n%s" "$PR_TITLE" "$CLEAN_BODY")
          elif [ -n "$PR_BODY" ]; then
            RELEASE_NOTES=$(printf "# Release v%s\n\n## 📋 Changelog\n\n%s" "${{ env.VERSION }}" "$PR_BODY")
          else
            echo "No PR found, falling back to manifest changelog."
            RELEASE_NOTES=$(printf "# Release v%s\n\n## 📋 Changelog\n\n%s" "${{ env.VERSION }}" "${{ env.CHANGELOG }}")
          fi
          
          DELIMITER="EOF_RELEASE_$(date +%s)"
          echo "RELEASE_BODY<<${DELIMITER}" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "${DELIMITER}" >> $GITHUB_ENV

      - name: Create Release
        if: steps.check_release.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          body: ${{ env.RELEASE_BODY }}
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true

      # Update Message in Remote Repository
      - name: Checkout Central Manifest Repo
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/jellyfin-plugin-manifest
          path: central-manifest
          token: ${{ secrets.JELLYFIN_PLUGIN_MANIFEST_UPDATER_PAT }}

      - name: Update Central Manifest
        if: steps.check_release.outputs.release_exists == 'false'
        shell: bash
        run: |
            cd central-manifest
            
            REPO_OWNER="${{ github.repository_owner }}"
            REPO_NAME="${{ github.event.repository.name }}"
            
            # 1. Get info from previous steps
            VERSION="${{ env.VERSION }}"
            HASH="${{ env.ZIP_HASH }}"
            TIME="${{ env.BUILD_TIME }}"
            DOWNLOAD_URL="https://github.com/$REPO_OWNER/$REPO_NAME/releases/download/v$VERSION/${{ env.ZIP_NAME }}"
            
            # 2. Get info from env
            PLUGIN_GUID="${{ env.PLUGIN_GUID }}"
            CHANGELOG="${{ env.CHANGELOG }}"
            TARGET_ABI="${{ env.TARGET_ABI }}"
            
            echo "Updating Central Manifest for Plugin GUID: $PLUGIN_GUID"
            
            # 3. Update/Overwrite versions in central manifest.json with local manifest.json
            LOCAL_VERSIONS=$(jq '.[0].versions' ../manifest.json)
            
            jq --arg guid "$PLUGIN_GUID" \
               --argjson local_versions "$LOCAL_VERSIONS" \
               'map(if .guid == $guid then .versions = $local_versions else . end)' \
               manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
               
      - name: Commit and Push Central Manifest
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          cd central-manifest
          git config user.name "CodeDevMLH"
          git config user.email "145071728+CodeDevMLH@users.noreply.github.com"
          
          # Check if there are changes
          if [[ -n $(git status -s) ]]; then
            git add manifest.json
            git commit -m "Auto-Update MediaBar Enhanced to v${{ env.VERSION }}"
            git push
          else
            echo "No changes to central manifest."
          fi
